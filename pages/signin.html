<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Amazing Travels</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
  </head>
  <body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">Amazing Travels</a>
        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav gap-3">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="signin.html">Sign In</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5" style="max-width: 420px;">
      
      <div class="card shadow-sm border-0 p-4 bg-white rounded">
        <h2 class="h4 fw-bold text-center mb-3">Sign In</h2>
        <!-- Form submits and immediately redirects back to index.html without storing values -->
        <form id="signinForm" onsubmit="return handleSignIn(event)">
          <div class="mb-3">
            <label for="usernameInput" class="form-label">Username</label>
            <input type="text" class="form-control" id="usernameInput" placeholder="Enter username" required />
          </div>
          <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required />
          </div>
          <button type="submit" id="signin-btn" class="btn btn-dark w-100 py-2">Sign In</button>
        </form>
      </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted small">
      <p class="mb-0">&copy; 2026 Amazing Travels. By Johnathan Ballard.</p>
    </footer>

    <!-- Bootstrap & Functional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script>
      function handleSignIn(event) {
        event.preventDefault();
        // Redirect directly back to index without saving anything to storage
        window.location.href = '../index.html';
        return false;
      }
    </script>
    <script src="../scripts/signin.js"></script>
  </body>
</html>
